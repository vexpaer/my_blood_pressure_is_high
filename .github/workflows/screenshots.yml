name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      # 用 Release 签名构建：高德 Key 与签名 SHA1 绑定，模拟器里才能看到真实地图
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 3; done'
            sleep 10
            adb shell pm grant io.github.vexpaer.mybp android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant io.github.vexpaer.mybp android.permission.ACCESS_COARSE_LOCATION || true
            adb shell appops set io.github.vexpaer.mybp GET_USAGE_STATS allow || true
            adb install -r app/build/outputs/apk/release/app-release.apk || adb install -r app/build/outputs/apk/release/app-release.apk
            adb emu geo fix 116.3975 39.9085 || true
            sleep 3
            adb shell am start -n io.github.vexpaer.mybp/.MainActivity
            sleep 8
            adb exec-out screencap -p > shot-onboarding.png
            adb shell input keyevent 4
            sleep 2
            adb shell am start -n io.github.vexpaer.mybp/.MainActivity --ez skip_onboarding true
            sleep 5
            adb exec-out screencap -p > shot-sleep-empty.png
            adb shell input tap 405 2120
            sleep 3
            adb exec-out screencap -p > shot-salt-privacy.png
            python3 scripts/ui_tap.py "同意并继续"
            sleep 4
            sleep 12
            adb exec-out screencap -p > shot-salt-map.png
            adb shell input keyevent 4
            sleep 1
            adb shell am start -n io.github.vexpaer.mybp/.MainActivity --ez skip_onboarding true --es seed_demo_data mybp-seed-2026
            sleep 6
            adb shell input tap 135 2120
            sleep 4
            adb exec-out screencap -p > shot-sleep-light.png
            adb shell input tap 405 2120
            sleep 12
            adb exec-out screencap -p > shot-salt-light.png
            adb shell input tap 675 2120
            sleep 3
            adb exec-out screencap -p > shot-move-light.png
            adb shell input tap 945 2120
            sleep 3
            adb exec-out screencap -p > shot-settings-light.png
            adb shell input swipe 540 1800 540 700 300
            sleep 2
            adb exec-out screencap -p > shot-settings-export.png
            adb shell input swipe 540 700 540 1800 300
            sleep 1
            adb shell cmd uimode night yes
            sleep 3
            adb shell input tap 135 2120
            sleep 3
            adb exec-out screencap -p > shot-sleep-dark.png
            adb shell input tap 405 2120
            sleep 8
            adb exec-out screencap -p > shot-salt-dark.png
            adb shell input tap 675 2120
            sleep 3
            adb exec-out screencap -p > shot-move-dark.png
            adb shell input tap 945 2120
            sleep 3
            adb exec-out screencap -p > shot-settings-dark.png
            adb shell cmd uimode night no
            adb shell ls /sdcard >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot-*.png
          if-no-files-found: error
