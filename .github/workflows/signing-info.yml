name: Signing info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Print certificate SHA1 / SHA256 (no secrets)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/ks.jks
          keytool -list -v -keystore /tmp/ks.jks -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -E "Alias name:|Owner:|SHA1:|SHA256:|Valid from:"
          rm -f /tmp/ks.jks
          echo "Package name: io.github.vexpaer.mybp"
